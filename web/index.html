<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Mind Map</title>
<style>
  :root { --bg: #fff; --fg: #222; --muted: #777; --line: #ddd; --panel: #f6f6f6; --hover: #e8eefc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1e1e1e; --fg: #ddd; --muted: #999; --line: #3a3a3a; --panel: #252526; --hover: #2f3b52; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; gap: 2px; padding: 4px 6px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #bar button { border: 0; background: none; color: var(--fg); padding: 4px 8px; border-radius: 4px; cursor: pointer; font: inherit; }
  #bar button:hover, #bar button.on { background: var(--hover); }
  #bar .sep { width: 1px; background: var(--line); margin: 2px 4px; }
  #main { flex: 1; display: flex; min-height: 0; }
  #src { width: 38%; resize: none; border: 0; border-right: 1px solid var(--line); padding: 10px; outline: none;
         background: var(--panel); color: var(--fg); font: 13px/1.5 ui-monospace, monospace; tab-size: 2; }
  #src.hidden { display: none; }
  #map { flex: 1; width: 100%; height: 100%; }
  @media (prefers-color-scheme: dark) { #map { --markmap-text-color: #ddd; --markmap-circle-open-bg: #444; --markmap-code-bg: #333; --markmap-code-color: #ddd; } }
  #menu { position: fixed; display: none; min-width: 210px; padding: 4px 0; background: var(--bg); color: var(--fg);
          border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 16px #0003; z-index: 10; }
  #menu .it { padding: 5px 14px; cursor: default; display: flex; justify-content: space-between; gap: 20px; }
  #menu .it:hover { background: var(--hover); }
  #menu .it.dis { color: var(--muted); pointer-events: none; }
  #menu .it kbd { color: var(--muted); font: inherit; }
  #menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  #menu .sw { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 14px; }
  #menu .sw span { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 1px solid #0002; }
  #menu .sw span:hover { outline: 2px solid var(--fg); }
  /* правка прямо в узле: тот же шрифт и масштаб, только рамка и каретка */
  .mm-edit { white-space: pre-wrap; outline: 1px solid #4e79a7; outline-offset: 2px; border-radius: 2px;
             cursor: text; user-select: text; -webkit-user-select: text; min-width: 4em; }
  .mm-edit:empty::before { content: attr(data-ph); color: var(--muted); }
  /* без opacity: в WebKitGTK она выносит содержимое foreignObject в слой, и тот рисуется не на месте */
  .mm-notes { font-size: 12px; line-height: 16px; color: var(--muted); padding-top: 5px; }
  /* страховка на кадр до растяжки foreignObject на полную высоту (app.js, _relayout) */
  #map .markmap-foreign, #print .markmap-foreign { overflow: visible; }
  /* внешний div markmap шириной 9999px (--markmap-max-width): без этого ловит клики по соседям справа */
  #map .markmap-foreign > div { pointer-events: none; }
  #map .markmap-foreign > div > div { pointer-events: auto; }
  .mm-notes ul { margin: 0; padding-left: 16px; }
  .mm-para { max-width: 24em; padding-bottom: 2px; }
  .mm-cb { cursor: pointer; user-select: none; }
  .mm-drop { position: fixed; display: none; pointer-events: none; z-index: 6; border: 2px solid #4e79a7; border-radius: 3px; }
  .mm-drop.before, .mm-drop.after { border-width: 2px 0 0; border-radius: 0; }
  .mm-ghost { position: fixed; pointer-events: none; z-index: 7; padding: 2px 8px; font: 13px sans-serif; color: var(--fg);
              background: var(--bg); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 2px 8px #0003; white-space: nowrap; }
  body.dragging, body.dragging * { cursor: grabbing !important; }
  .mm-done { text-decoration: line-through; color: var(--muted); }
  .markmap-foreign img { max-width: 240px; max-height: 180px; vertical-align: middle; }
  .mm-nt { cursor: pointer; user-select: none; font-size: 11px; }
  .mm-nt:hover { color: var(--fg); }
  #print { display: none; }
  @media print {
    @page { margin: 0; }
    html, body { height: 100%; overflow: hidden; background: #fff; }
    body > * { display: none !important; }
    #print { display: block !important; }
    #print svg { display: block; --markmap-text-color: #333; --markmap-circle-open-bg: #fff; --muted: #777; }
  }
</style>
</head>
<body>
<div id="bar">
  <button data-cmd="file" id="fileBtn">Файл ▾</button>
  <span class="sep"></span>
  <button data-cmd="toggleSrc" id="srcBtn" title="Ctrl+E">Исходник</button>
  <button data-cmd="fit" title="Ctrl+0">Вписать</button>
  <button data-cmd="undo" title="Ctrl+Z">↶</button>
  <button data-cmd="redo" title="Ctrl+Y">↷</button>
</div>
<div id="main">
  <textarea id="src" class="hidden" spellcheck="false"></textarea>
  <svg id="map"></svg>
</div>
<div id="menu"></div>
<div id="print"></div>
<script src="vendor/d3.min.js"></script>
<script src="vendor/markmap-lib.js"></script>
<script src="vendor/markmap-view.js"></script>
<script src="mdtree.js"></script>
<script src="app.js"></script>
</body>
</html>
